# ──────────────────────────────────────────────
# Playbook: Stack de Observabilidad — Fastory
# ──────────────────────────────────────────────
# Despliega el stack completo de monitoreo en el
# servidor de la aplicacion usando Docker Compose.
# Incluye: Prometheus, Grafana, Loki, Alloy,
# node-exporter y cAdvisor.
# ──────────────────────────────────────────────
# Uso: ansible-playbook playbooks/setup-monitoring.yml
# ──────────────────────────────────────────────

---
- name: Desplegar stack de observabilidad Fastory
  hosts: app_servers
  become: yes

  vars:
    monitoring_dir: /opt/fastory/monitoring

  tasks:
    # ════════════════════════════════════════════
    # 1. PREPARAR DIRECTORIO DE MONITOREO
    # ════════════════════════════════════════════

    - name: Crear directorio principal de monitoreo
      file:
        path: "{{ monitoring_dir }}"
        state: directory
        owner: ec2-user
        group: ec2-user
        mode: '0755'
      tags: [setup]

    - name: Crear directorio de provisioning de Grafana
      file:
        path: "{{ monitoring_dir }}/grafana/provisioning/datasources"
        state: directory
        owner: ec2-user
        group: ec2-user
        mode: '0755'
        recurse: yes
      tags: [setup]

    # ════════════════════════════════════════════
    # 2. COPIAR ARCHIVOS DE CONFIGURACION
    # ════════════════════════════════════════════

    - name: Copiar Docker Compose del stack de observabilidad
      copy:
        src: ../files/monitoring/docker-compose.monitoring.yml
        dest: "{{ monitoring_dir }}/docker-compose.yml"
        owner: ec2-user
        group: ec2-user
        mode: '0644'
      tags: [config]

    - name: Copiar configuracion de Prometheus (scraping)
      copy:
        src: ../files/monitoring/prometheus.yml
        dest: "{{ monitoring_dir }}/prometheus.yml"
        owner: ec2-user
        group: ec2-user
        mode: '0644'
      tags: [config]

    - name: Copiar configuracion de Alloy (recolector de logs)
      copy:
        src: ../files/monitoring/alloy-config.alloy
        dest: "{{ monitoring_dir }}/alloy-config.alloy"
        owner: ec2-user
        group: ec2-user
        mode: '0644'
      tags: [config]

    - name: Copiar provisioning de datasources de Grafana
      copy:
        src: ../files/monitoring/grafana/provisioning/datasources/datasources.yml
        dest: "{{ monitoring_dir }}/grafana/provisioning/datasources/datasources.yml"
        owner: ec2-user
        group: ec2-user
        mode: '0644'
      tags: [config]

    # ════════════════════════════════════════════
    # 3. DESPLEGAR EL STACK CON DOCKER COMPOSE
    # ════════════════════════════════════════════

    - name: Levantar stack de observabilidad con Docker Compose
      command: docker compose up -d
      args:
        chdir: "{{ monitoring_dir }}"
      tags: [deploy]

    # ════════════════════════════════════════════
    # 4. VERIFICACIONES
    # ════════════════════════════════════════════

    - name: Esperar a que Grafana este disponible
      uri:
        url: "http://localhost:3000/api/health"
        status_code: 200
      register: grafana_health
      retries: 10
      delay: 5
      until: grafana_health.status == 200
      tags: [verify]

    - name: Esperar a que Prometheus este disponible
      uri:
        url: "http://localhost:9090/-/healthy"
        status_code: 200
      register: prometheus_health
      retries: 10
      delay: 5
      until: prometheus_health.status == 200
      tags: [verify]

    - name: Mostrar estado del stack
      debug:
        msg:
          - "Grafana:    http://{{ ansible_host }}:3000 (admin/fastory2026)"
          - "Prometheus: http://{{ ansible_host }}:9090"
          - "Loki:       http://{{ ansible_host }}:3100"
          - "Alloy:      http://{{ ansible_host }}:12345"
      tags: [verify]
