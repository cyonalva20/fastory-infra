# ──────────────────────────────────────────────
# Prometheus — Configuracion de scraping
# ──────────────────────────────────────────────
# Define los targets de los cuales Prometheus
# recolecta metricas cada 15 segundos.
# ──────────────────────────────────────────────

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # ── Metricas del propio Prometheus ──
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # ── Metricas del host (node-exporter) ──
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          tier: 'infrastructure'

  # ── Metricas por contenedor (cAdvisor) ──
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
        labels:
          tier: 'infrastructure'

  # ── Metricas del backend Spring Boot (Actuator/Prometheus) ──
  - job_name: 'fastory-backend'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 10s
    static_configs:
      - targets: ['host.docker.internal:8080']
        labels:
          application: 'fastory-backend'
          tier: 'application'
