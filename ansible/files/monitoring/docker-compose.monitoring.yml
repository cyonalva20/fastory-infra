# ──────────────────────────────────────────────
# Docker Compose: Stack de Observabilidad — Fastory
# ──────────────────────────────────────────────
# Levanta el stack completo de monitoreo:
# Prometheus (metricas), Loki (logs), Alloy (recolector),
# Grafana (dashboards), node-exporter y cAdvisor.
# ──────────────────────────────────────────────
# Uso: docker compose -f docker-compose.monitoring.yml up -d
# ──────────────────────────────────────────────

services:
  # ════════════════════════════════════════════
  # PROMETHEUS — Recolector y almacen de metricas
  # ════════════════════════════════════════════
  prometheus:
    image: prom/prometheus:latest
    container_name: fastory-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=15d'
    restart: unless-stopped
    networks:
      - monitoring

  # ════════════════════════════════════════════
  # LOKI — Almacen de logs
  # ════════════════════════════════════════════
  loki:
    image: grafana/loki:latest
    container_name: fastory-loki
    ports:
      - "3100:3100"
    volumes:
      - loki_data:/loki
    restart: unless-stopped
    networks:
      - monitoring

  # ════════════════════════════════════════════
  # ALLOY — Recolector de logs (reemplazo de Promtail)
  # ════════════════════════════════════════════
  alloy:
    image: grafana/alloy:latest
    container_name: fastory-alloy
    ports:
      - "12345:12345"
    volumes:
      - ./alloy-config.alloy:/etc/alloy/config.alloy
      - /var/log:/var/log:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command:
      - run
      - /etc/alloy/config.alloy
      - --server.http.listen-addr=0.0.0.0:12345
    depends_on:
      - loki
    restart: unless-stopped
    networks:
      - monitoring

  # ════════════════════════════════════════════
  # NODE-EXPORTER — Metricas del host (CPU, memoria, disco)
  # ════════════════════════════════════════════
  node-exporter:
    image: prom/node-exporter:latest
    container_name: fastory-node-exporter
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    restart: unless-stopped
    networks:
      - monitoring

  # ════════════════════════════════════════════
  # cADVISOR — Metricas por contenedor (CPU, memoria)
  # ════════════════════════════════════════════
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: fastory-cadvisor
    ports:
      - "8081:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    restart: unless-stopped
    networks:
      - monitoring

  # ════════════════════════════════════════════
  # GRAFANA — Dashboards y alarmas
  # ════════════════════════════════════════════
  grafana:
    image: grafana/grafana:latest
    container_name: fastory-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: fastory2026
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
      - loki
    restart: unless-stopped
    networks:
      - monitoring

volumes:
  prometheus_data:
  loki_data:
  grafana_data:

networks:
  monitoring:
    driver: bridge
