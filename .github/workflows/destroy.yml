name: Destroy Infrastructure

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Entorno a destruir (dev o prod)"
        required: true
        type: choice
        options:
          - dev
          - prod
      confirm:
        description: 'Escribe "DESTROY" para confirmar la destrucción total'
        required: true
        default: ''

permissions:
  id-token: write
  contents: read

env:
  TF_VERSION: "1.9.0"
  WORKING_DIR: "./terraform"

jobs:
  terraform-destroy:
    name: "Terraform Destroy (${{ inputs.environment }})"
    runs-on: ubuntu-latest
    if: github.event.inputs.confirm == 'DESTROY'
    environment: ${{ inputs.environment }}

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        working-directory: ${{ env.WORKING_DIR }}
        run: terraform init -input=false

      - name: Terraform Workspace
        working-directory: ${{ env.WORKING_DIR }}
        run: terraform workspace select ${{ inputs.environment }}

      - name: Terraform Destroy
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          terraform destroy -auto-approve -input=false \
            -var-file=environments/${{ inputs.environment }}.tfvars
